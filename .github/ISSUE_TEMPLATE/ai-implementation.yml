name: AI implementation request
description: Ask the guarded AI agent to implement a scoped rancorder.dev change
title: "[AI] "
body:
  - type: markdown
    attributes:
      value: |
        Describe one coherent implementation. After reviewing the Issue, add the `ai-implement` label to start the agent.
  - type: textarea
    id: objective
    attributes:
      label: What should change?
      description: Describe the desired user-visible or machine-readable result.
      placeholder: "例: Authority AuditにAI Query Simulatorを追加してください。"
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done condition
      description: What must be true when the change is complete?
      placeholder: "例: mobile対応、Career Graphとの接続、npm run validate PASS"
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / notes
      description: Optional design, content, or implementation constraints.
