name: AI Implementation Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-implementation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ai-implement'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install dependencies before sandboxed agent
        run: npm ci

      - name: Create implementation branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="ai/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Run Gemini implementation agent
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ""
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_issue_number: ${{ github.event.issue.number }}
          prompt: |
            Implement GitHub Issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            ISSUE TITLE:
            ${{ github.event.issue.title }}

            ISSUE BODY:
            ${{ github.event.issue.body }}

            Follow GEMINI.md and AGENTS.md as the repository implementation contract.
            Do not edit workflow files, GEMINI.md, AGENTS.md, credentials, or security configuration.
            Do not commit, push, merge, or create a PR yourself.
            Work only inside the checked-out repository.
            Run npm run validate:graph and the relevant local checks before finishing.

      - name: Validate generated change
        run: npm run validate

      - name: Ensure protected agent files were not changed
        run: |
          if ! git diff --quiet main -- .github/workflows GEMINI.md AGENTS.md; then
            echo "::error::AI attempted to modify protected agent/workflow files."
            git diff -- main -- .github/workflows GEMINI.md AGENTS.md
            exit 1
          fi

      - name: Commit and push
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if git diff --quiet; then
            echo "::error::Agent produced no code changes."
            exit 1
          fi
          git config user.name "rancorder-gemini-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gemini: implement issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"

      - name: Open guarded pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          FINAL_MESSAGE: ${{ steps.gemini.outputs.summary }}
        run: |
          {
            echo "Implements #${ISSUE_NUMBER}"
            echo
            echo "## Gemini implementation report"
            printf '%s\n' "$FINAL_MESSAGE"
            echo
            echo "## Merge gate"
            echo "- [x] Agent worked on a branch"
            echo "- [x] npm run validate passed before push"
            echo "- [x] Protected workflow/instruction files unchanged"
            echo "- [ ] Human review"
            echo "- [ ] Required GitHub checks pass"
          } > /tmp/pr-body.md
          gh pr create --base main --head "$BRANCH" --title "Gemini: $ISSUE_TITLE" --body-file /tmp/pr-body.md

      - name: Report failure on Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "🤖 Gemini implementation failed safely. No merge was performed. [Open workflow run]($RUN_URL)"
