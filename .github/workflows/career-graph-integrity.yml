name: Career Graph Integrity

on:
  push:
    branches: [main]
    paths:
      - 'lib/career-graph.ts'
      - 'lib/case-studies.ts'
      - 'content/blog/**'
      - 'scripts/validate-career-graph.js'
      - 'package.json'
  pull_request:
    paths:
      - 'lib/career-graph.ts'
      - 'lib/case-studies.ts'
      - 'content/blog/**'
      - 'scripts/validate-career-graph.js'
      - 'package.json'

permissions:
  contents: read

jobs:
  graph-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Machine-readable Career Graph
        run: npm run validate:graph
